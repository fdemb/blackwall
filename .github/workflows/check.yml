name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blackwall
          POSTGRES_PASSWORD: blackwall
          POSTGRES_DB: blackwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackwall -d blackwall"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://blackwall:blackwall@127.0.0.1:5432/blackwall
      TEST_POSTGRES_URL: postgres://blackwall:blackwall@127.0.0.1:5432/blackwall
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: ./scripts/check.sh
      - run: cargo build --locked
      - run: python3 scripts/smoke.py
