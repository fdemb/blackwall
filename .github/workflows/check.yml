name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blackwall
          POSTGRES_PASSWORD: blackwall
          POSTGRES_DB: blackwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackwall -d blackwall"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://blackwall:blackwall@127.0.0.1:5432/blackwall
      TEST_POSTGRES_URL: postgres://blackwall:blackwall@127.0.0.1:5432/blackwall
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Test databases are thrown away, so skip waiting for disk writes.
      - run: >-
          psql "$TEST_POSTGRES_URL"
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      # Checked queries compile against a migrated schema and rewrite .sqlx, so stale metadata shows up as a diff.
      - run: |
          psql "$TEST_POSTGRES_URL" -c "CREATE DATABASE blackwall_schema"
          for migration in migrations/*.sql; do
            psql "${TEST_POSTGRES_URL%/*}/blackwall_schema" -v ON_ERROR_STOP=1 -1 -q -f "$migration"
          done
          rm -rf .sqlx && mkdir .sqlx
      - run: cargo build --locked
        env:
          SQLX_OFFLINE: "false"
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/.sqlx
          DATABASE_URL: postgres://blackwall:blackwall@127.0.0.1:5432/blackwall_schema
      - run: ./scripts/check.sh
      - run: python3 scripts/smoke.py
      - name: generated files are committed
        run: |
          git add -N .sqlx
          git diff --exit-code --stat -- .sqlx web/app/lib/openapi.json web/app/lib/api.gen.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            .sqlx
            web/app/lib/openapi.json
            web/app/lib/api.gen.ts
          retention-days: 3
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --locked --release --target aarch64-unknown-linux-gnu
      - run: cd web && pnpm install --frozen-lockfile && pnpm run build
      - run: |
          mkdir release
          cp target/aarch64-unknown-linux-gnu/release/blackwall release/
          cp -r web/build/client release/web
          tar -czf blackwall.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: blackwall-aarch64
          path: blackwall.tar.gz
          retention-days: 7
  deploy:
    needs: [check, build]
    runs-on: [self-hosted, deploy]
    environment:
      name: production
      url: https://blackwall.example.com
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blackwall-aarch64
          path: ${{ runner.temp }}/release
      - run: sudo /usr/local/sbin/blackwall-deploy "$RUNNER_TEMP/release/blackwall.tar.gz" "$GITHUB_SHA"
