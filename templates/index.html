<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Blackwall</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar"><a class="brand" href="/">Blackwall</a><span id="identity"></span><button id="logout" hidden data-i18n="logout">Sign out</button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="auth" class="auth" hidden>
<h1 data-i18n="welcome">Organize your team's work</h1>
<p data-i18n="auth_hint">Sign in or create an account to get started.</p>
<form id="auth-form">
<label><span data-i18n="email">Email</span><input name="email" type="email" autocomplete="email" required></label>
<label><span data-i18n="password">Password</span><input name="password" type="password" autocomplete="current-password" required></label>
<label id="name-field" hidden><span data-i18n="display_name">Display name</span><input name="display_name" autocomplete="name"></label>
<button type="submit" data-i18n="sign_in">Sign in</button><button type="button" id="auth-mode" class="secondary" data-i18n="register">Create account</button>
</form>
<details><summary data-i18n="forgot_password">Forgot your password?</summary>
<form id="reset-request"><label><span data-i18n="email">Email</span><input name="email" type="email" required></label><button data-i18n="request_reset">Request recovery</button></form>
<form id="reset-password"><label><span data-i18n="reset_token">Recovery token</span><input name="token" required></label><label><span data-i18n="new_password">New password</span><input name="password" type="password" minlength="12" required></label><button data-i18n="reset_password">Reset password</button></form>
</details>
</section>
<div id="application" class="shell" hidden>
<aside>
<label><span data-i18n="workspace">Workspace</span><select id="workspace" aria-label="Workspace"></select></label>
<button id="new-workspace" class="secondary" data-i18n="new_workspace">New workspace</button>
<nav id="nav" aria-label="Workspace views">
<button data-view="issues" data-i18n="issues">Issues</button><button data-view="backlog" data-i18n="backlog">Backlog</button><button data-view="mine" data-i18n="my_issues">My issues</button><button data-view="board" data-i18n="board">Board</button><button data-view="planning" data-i18n="planning">Planning</button><button data-view="inbox" data-i18n="inbox">Inbox</button><button data-view="reports" data-i18n="reports">Reports</button><button data-view="members" data-i18n="members">People</button><button data-view="trash" data-i18n="trash">Trash</button><button data-view="settings" data-i18n="settings">Settings</button>
</nav>
<label><span data-i18n="search">Search</span><input id="search" type="search" placeholder="Search issues and people"></label>
<div id="saved-views"></div><details><summary data-i18n="accept_invitation">Accept an invitation</summary><form id="join-workspace"><label><span data-i18n="workspace_id">Workspace ID</span><input name="workspace_id" required></label><label><span data-i18n="invitation_token">Invitation token</span><input name="token" required></label><button data-i18n="accept">Accept</button></form></details>
<a href="/api/schema.json" target="_blank" rel="noopener" class="api-link">API schema</a>
</aside>
<main id="main" tabindex="-1">
<div class="page-heading"><h1 id="page-title">Issues</h1><div class="row-actions"><button id="refresh" class="secondary" data-i18n="refresh">Refresh</button><button id="new-issue" data-i18n="new_issue">New issue</button></div></div>
<div id="filters" class="filters"></div>
<div id="content"></div>
<section id="detail" hidden></section>
</main>
</div>
<noscript><p>This reference client requires JavaScript. The Rust API is available at <a href="/api/schema.json">/api/schema.json</a>.</p></noscript>
</body>
</html>
