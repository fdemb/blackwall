# Local development services. Start with `docker compose up -d`.
services:
  # Catches all outgoing mail. The app sends to SMTP on localhost:1025, and the inbox is at
  # http://localhost:8025. Ports bind to loopback only.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
